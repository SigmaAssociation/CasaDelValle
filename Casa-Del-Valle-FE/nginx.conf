server {
    listen 80;
    server_name casadelvalle.online www.casadelvalle.online;
    return 301 https://casadelvalle.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name casadelvalle.online www.casadelvalle.online;

    ssl_certificate /etc/letsencrypt/live/casadelvalle.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/casadelvalle.online/privkey.pem;

    location /cdv-api/ {
        proxy_pass http://backend-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
