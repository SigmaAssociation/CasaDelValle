<header class="bg-green text-cream shadow-md">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-serif font-bold tracking-wide">
      <a routerLink="/">Casa Del Valle</a>
    </h1>
    <nav class="space-x-6 font-sans text-sm font-medium">
      <a routerLink="/" class="hover:text-orange transition">Inicio</a>
      @if (auth.isAuthenticated()) {
        <a routerLink="/mis-cabanas" class="hover:text-orange transition">Mis Cabañas</a>
        <a routerLink="/registrar-cabana" class="hover:text-orange transition">Registrar Cabaña</a>
        <a routerLink="/perfil" class="hover:text-orange transition">Perfil</a>
        <button type="button" (click)="onLogout()" class="hover:text-orange transition cursor-pointer bg-transparent border-0 p-0 font-sans text-sm font-medium text-cream">
          Cerrar Sesión
        </button>
      } @else {
        <a routerLink="/registro" class="hover:text-orange transition">Registro</a>
        <a routerLink="/login" class="hover:text-orange transition">Inicio de sesión</a>
      }
    </nav>
  </div>
</header>
