<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100">
    <h2 class="text-3xl mb-2">Crear Cuenta</h2>
    <p class="text-gray-500 text-sm mb-6 font-sans">Únete a nuestra plataforma.</p>

    <form #form="ngForm" class="space-y-5">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <!-- Clases estandarizadas para inputs -->
            <input type="text" name="name" ngModel required
                class="w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
            <input type="email" name="email" ngModel required 
                class="w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>

        <!-- Botón primario estandarizado -->
        <button type="submit" [disabled]="form.invalid"
            class="w-full bg-orange hover:bg-orange-dark text-white font-medium py-2.5 px-4 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Registrarse
        </button>
    </form>
</div>
