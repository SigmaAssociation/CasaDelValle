<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100">
  <h2 class="text-3xl mb-2">Editar Cabaña</h2>
  <p class="text-gray-500 text-sm mb-6 font-sans">Actualiza la información de la cabaña.</p>

  <!-- EXITO -->
  @if (successMessage) {
    <div class="mb-5 p-3 rounded-md bg-green-50 text-green-700 text-sm border border-green-200">
      {{ successMessage }}
    </div>
  }

  <!-- ERROR -->
  @if (errorMessage) {
    <div class="mb-5 p-3 rounded-md bg-red-50 text-red-700 text-sm border border-red-200">
      {{ errorMessage }}
    </div>
  }

  <form [formGroup]="cabinForm" (ngSubmit)="edit()" class="space-y-5">
    <!-- ID (oculto, no editable) -->
    <input type="hidden" formControlName="id" />

    <!-- DIRECCION -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
      <input
        type="text"
        maxlength="255"
        formControlName="address"
        autocomplete="address"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-orange focus:ring-orange sm:text-sm"
      />
    </div>

    <!-- PRECIO -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Precio</label>
      <input
        type="number"
        step="0.01"
        min="0"
        formControlName="price"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-orange focus:ring-orange sm:text-sm"
      />
    </div>

    <!-- DESCRIPCION -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
      <textarea
        formControlName="description"
        rows="3"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-orange focus:ring-orange sm:text-sm"
      ></textarea>
    </div>

    <!-- CAPACIDAD -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Capacidad</label>
      <input
        type="number"
        min="1"
        formControlName="capacity"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-orange focus:ring-orange sm:text-sm"
      />
    </div>

    <!-- REGLAS -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Reglas</label>
      <textarea
        formControlName="rules"
        rows="3"
        class="w-full rounded-md border-gray-300 shadow-sm focus:border-orange focus:ring-orange sm:text-sm"
      ></textarea>
    </div>

    <!-- BOTÓN -->
    <button
      type="submit"
      [disabled]="cabinForm.invalid"
      class="w-full bg-orange hover:bg-orange-dark text-white font-medium py-2.5 px-4 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Editar
    </button>
  </form>
</div>
