@if (auth.isLoggedIn()) {
  <app-cabin-list-page></app-cabin-list-page>
} @else {
  <div class="flex flex-col items-center justify-center text-center py-10 px-4">
    <span class="text-orange font-bold tracking-widest uppercase text-sm mb-4">Conecta con la naturaleza</span>
    <h1 class="text-5xl md:text-6xl font-serif font-bold text-brown mb-6">
      Tu descanso en <br/>Casa Del Valle
    </h1>
    <p class="text-lg text-black max-w-2xl mb-10 leading-relaxed">
      La plataforma ideal para reservar, gestionar y rentar cabañas.
    </p>

    <div class="flex gap-4 font-sans mb-12">
      <a routerLink="/registro" class="bg-orange text-white px-8 py-3 rounded-md font-bold hover:opacity-90 transition">
        Crear una cuenta
      </a>
      <a routerLink="/login" class="bg-green text-white px-8 py-3 rounded-md font-bold hover:opacity-90 transition">
        Iniciar sesión
      </a>
    </div>
  </div>
}
