@if (cabin) {
  <div class="max-w-3xl mx-auto mb-4">
    <a
      [routerLink]="['/']"
      class="inline-flex items-center gap-2 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Volver al listado
    </a>
  </div>

  <app-cabin-edit-form [cabin]="cabin"></app-cabin-edit-form>
} @else if (notFound) {
  <!-- Modal-->
  <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-center">
    <h2 class="text-xl font-medium text-gray-800 mb-2">Cabaña no encontrada</h2>
    <p class="text-gray-500 text-sm mb-6">
      No pudimos encontrar la cabaña que buscas. Puede que haya sido eliminada o el enlace sea incorrecto.
    </p>

    <a
      [routerLink]="['/']"
      class="inline-block bg-orange hover:bg-orange-dark text-white font-medium py-2.5 px-4 rounded-md transition-colors"
    >
      Volver al listado
    </a>
  </div>
}
