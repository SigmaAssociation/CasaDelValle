services:
  # Servicio de Base de Datos
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  # Servicio del Backend (Go)
  backend-api:
    build:
      context: ./cdv-api # Ruta a la carpeta de tu repositorio de Go
      dockerfile: Dockerfile.dev
    container_name: go_api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./cdv-api:/app
    depends_on:
      postgres-db:
        condition: service_healthy

  # Servicio del Frontend (Angular)
  frontend-app:
    build:
      context: ../CDV_Frontend/Casa-Del-Valle-FE
      dockerfile: Dockerfile.dev
    container_name: angular_frontend
    ports:
      - "4200:4200"
    volumes:
      - ../CDV_Frontend/Casa-Del-Valle-FE:/app
      - /app/node_modules
    depends_on:
      - backend-api

volumes:
  pgdata:
