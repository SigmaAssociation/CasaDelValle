name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22.22.3'
  IMAGE_OWNER: mynordaniel
  VM_APP_PATH: /home/CasaDelValle

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: cdv-api/go.sum

      - name: Run Go tests
        working-directory: cdv-api
        run: go test ./...

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Casa-Del-Valle-FE/package-lock.json

      - name: Install dependencies
        working-directory: Casa-Del-Valle-FE
        run: npm ci

      - name: Run Angular tests
        working-directory: Casa-Del-Valle-FE
        run: npm test -- --watch=false

  build-images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: MynorDaniel
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./cdv-api
          file: ./cdv-api/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/casadelvalle-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/casadelvalle-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Casa-Del-Valle-FE
          file: ./Casa-Del-Valle-FE/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/casadelvalle-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/casadelvalle-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push'

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Trust VM host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Update services on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "$VM_USER@$VM_HOST" "cd '${VM_APP_PATH}' && git pull --ff-only origin main && export BACKEND_IMAGE_TAG='${IMAGE_TAG}' FRONTEND_IMAGE_TAG='${IMAGE_TAG}' && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans"
