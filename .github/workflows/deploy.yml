name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app to Ubuntu VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PATH: ${{ secrets.VM_APP_PATH }}
        run: |
          ssh "$VM_USER@$VM_HOST" "mkdir -p '$VM_PATH' && cd '$VM_PATH' && git pull origin main && docker compose -f docker-compose.prod.yml down --remove-orphans && docker compose -f docker-compose.prod.yml up -d --build"
