name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_OWNER: mynordaniel
  VM_APP_PATH: /home/CasaDelValle

jobs:
  build-images:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: MynorDaniel
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./cdv-api
          file: ./cdv-api/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/casadelvalle-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/casadelvalle-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Casa-Del-Valle-FE
          file: ./Casa-Del-Valle-FE/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/casadelvalle-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/casadelvalle-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Trust VM host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Update services on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "$VM_USER@$VM_HOST" "cd '${VM_APP_PATH}' && git pull --ff-only origin main && export BACKEND_IMAGE_TAG='${IMAGE_TAG}' FRONTEND_IMAGE_TAG='${IMAGE_TAG}' && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans"
