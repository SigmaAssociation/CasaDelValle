      summary: Obtener usuario por ID
      tags:
      - Usuarios
    put:
      consumes:
      - application/json
      description: Actualiza los datos de perfil. Solo el propio usuario o un administrador.
        Requiere token.
      parameters:
      - description: ID de usuario
        in: path
        name: id
        required: true
        type: integer
      - description: Datos a actualizar
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/users.UserUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: Usuario actualizado exitosamente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Datos de entrada inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuario no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: El correo ya está registrado por otro usuario
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar usuario
      tags:
      - Usuarios
  /users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Convierte la cuenta indicada de huésped a anfitrión. Solo el mismo
        usuario o un admin. Si el usuario se actualiza a sí mismo, la respuesta incluye
        un token fresco con el nuevo rol. Requiere token.
      parameters:
      - description: ID de usuario
        in: path
        name: id
        required: true
        type: integer
      - description: Rol destino (solo anfitrión)
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/users.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Rol actualizado
          schema:
            $ref: '#/definitions/users.UpdateRoleResponse'
        "400":
          description: Datos inválidos o cambio no permitido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuario no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cambiar rol a anfitrión
      tags:
      - Usuarios
securityDefinitions:
  BearerAuth:
    description: 'Token JWT obtenido en el endpoint login. Enviar como: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
