  /reports/reservations:
    get:
      description: Devuelve las cabañas ordenadas por cantidad de reservaciones (descendente),
        con la información de cada reservación. Solo aparecen cabañas con al menos
        una reservación que cumpla los filtros. Las fechas se interpretan en hora
        de Guatemala. Solo administradores. Requiere token.
      parameters:
      - description: Filtro por ID de anfitrión
        in: query
        name: host_id
        type: integer
      - description: Filtro por ID de cabaña
        in: query
        name: cabin_id
        type: integer
      - description: Filtro por ID de huésped
        in: query
        name: guest_id
        type: integer
      - description: 'Estado de la reservación: pendiente, confirmada, en_curso, finalizada,
          cancelada'
        in: query
        name: status
        type: string
      - description: Reservaciones creadas desde esta fecha, inclusive (YYYY-MM-DD)
        in: query
        name: created_from
        type: string
      - description: Reservaciones creadas hasta esta fecha, inclusive (YYYY-MM-DD)
        in: query
        name: created_to
        type: string
      produces:
      - application/json
      responses:
