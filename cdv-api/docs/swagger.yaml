basePath: /cdv-api
definitions:
  internal_cabins.CabinCardResponse:
    properties:
      address:
        type: string
      capacity:
        type: integer
      host_id:
        type: integer
      host_name:
        type: string
      id:
        type: integer
      image_url:
        type: string
      name:
        type: string
      price:
        type: number
    type: object
  internal_cabins.CabinCardsListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_cabins.CabinCardResponse'
        type: array
      total:
        type: integer
    type: object
  internal_cabins.CabinResponse:
    properties:
      address:
        type: string
      capacity:
        type: integer
      commission_id:
        type: integer
      description:
        type: string
      host_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      price:
        type: number
      rules:
        type: string
    type: object
  internal_cabins.CabinsListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_cabins.CabinResponse'
        type: array
      total:
        type: integer
    type: object
  internal_cabins.CreateCabinRequest:
    properties:
      address:
        type: string
      capacity:
        type: integer
      commission_id:
        type: integer
      description:
        type: string
      host_id:
        type: integer
      name:
        type: string
      price:
        type: number
      rules:
        type: string
    type: object
  internal_cabins.CreateCabinResponse:
    properties:
      cabin_id:
        type: integer
      message:
        type: string
    type: object
  internal_cabins.DeleteCabinResponse:
    properties:
      message:
        type: string
      rows_affected:
        type: integer
    type: object
  internal_cabins.UpdateCabinRequest:
    properties:
      address:
        type: string
      capacity:
        type: integer
      description:
        type: string
      name:
        type: string
      price:
        type: number
      rules:
        type: string
    type: object
  internal_images.CreateImageResponse:
    properties:
      image_id:
        type: integer
      message:
        type: string
      path:
        type: string
    type: object
  internal_images.ImageResponse:
    properties:
      cabin_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      path:
        type: string
      user_id:
        type: integer
    type: object
  internal_images.ImagesListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_images.ImageResponse'
        type: array
      total:
        type: integer
    type: object
  internal_reservations.CancelReservationResponse:
    properties:
      message:
        type: string
      reservation:
        $ref: '#/definitions/internal_reservations.ReservationDetail'
    type: object
  internal_reservations.CreateReservationResponse:
    properties:
      message:
        type: string
      reservation_id:
        type: integer
    type: object
  internal_reservations.ReservationDetail:
    properties:
      cabin_id:
        type: integer
      cancelled_at:
        type: string
      end_date:
        type: string
      host_id:
        type: integer
      id:
        type: integer
      start_date:
        type: string
      status:
        type: string
      user_id:
        type: integer
    type: object
  internal_reservations.ReservationRequest:
    properties:
      cabin_id:
        type: integer
      end_date:
        description: Formato AAAA-MM-DD
        type: string
      start_date:
        description: Formato AAAA-MM-DD
        type: string
      user_id:
        type: integer
    type: object
  internal_reservations.UpdateReservationRequest:
    properties:
      cabin_id:
        type: integer
      end_date:
        description: Formato AAAA-MM-DD
        type: string
      start_date:
        description: Formato AAAA-MM-DD
        type: string
    type: object
  internal_reservations.UpdateReservationResponse:
    properties:
      message:
        type: string
      reservation:
        $ref: '#/definitions/internal_reservations.ReservationDetail'
    type: object
  internal_users.RegisterRequest:
    properties:
      address:
        type: string
      dpi:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  internal_users.RegisterResponse:
    properties:
      mensaje:
        type: string
      user_id:
        type: integer
    type: object
  internal_users.User:
    properties:
      address:
        type: string
      dpi:
        type: string
      email:
        type: string
      id:
        type: integer
      id_role:
        type: integer
      name:
        type: string
      phone:
        type: string
    type: object
  internal_users.UserLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_users.UserLoginResponse:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  internal_users.UserUpdate:
    properties:
      address:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Documentación de los endpoints de la API de Casa Del Valle.
  title: Casa Del Valle API
  version: "1.0"
paths:
  /cabins:
    get:
      description: Devuelve el listado completo de cabañas.
      produces:
      - application/json
      responses:
        "200":
          description: Lista de cabañas
          schema:
            $ref: '#/definitions/internal_cabins.CabinsListResponse'
        "500":
          description: Error al obtener las cabañas
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar cabañas
      tags:
      - Cabañas
    post:
      consumes:
      - application/json
      description: Crea una cabaña. Para anfitriones el id_anfitrion se toma del token;
        para administradores puede indicarse. Requiere token.
      parameters:
      - description: Datos de la cabaña
        in: body
        name: cabin
        required: true
        schema:
          $ref: '#/definitions/internal_cabins.CreateCabinRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Cabaña registrada exitosamente
          schema:
            $ref: '#/definitions/internal_cabins.CreateCabinResponse'
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Registrar cabaña
      tags:
      - Cabañas
  /cabins/{id}:
    delete:
      description: Elimina una cabaña. Solo el dueño de la cabaña o un administrador.
        Requiere token.
      parameters:
      - description: ID de cabaña
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Cabaña eliminada exitosamente
          schema:
            $ref: '#/definitions/internal_cabins.DeleteCabinResponse'
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Cabaña no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar cabaña
      tags:
      - Cabañas
    get:
      description: Devuelve los detalles de la cabaña indicada. Requiere token.
      parameters:
      - description: ID de cabaña
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Detalle de la cabaña
          schema:
            $ref: '#/definitions/internal_cabins.CabinResponse'
        "400":
          description: ID de cabaña inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Cabaña no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtener cabaña por ID
      tags:
      - Cabañas
    put:
      consumes:
      - application/json
      description: Actualiza los datos de una cabaña. Solo el dueño de la cabaña o
        un administrador. Requiere token.
      parameters:
      - description: ID de cabaña
        in: path
        name: id
        required: true
        type: integer
      - description: Datos a actualizar
        in: body
        name: cabin
        required: true
        schema:
          $ref: '#/definitions/internal_cabins.UpdateCabinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Cabaña actualizada exitosamente
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Cabaña no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar cabaña
      tags:
      - Cabañas
  /cabins/images/{cabinId}:
    get:
      description: Devuelve todas las imágenes asociadas a la cabaña indicada.
      parameters:
      - description: ID de cabaña
        in: path
        name: cabinId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lista de imágenes
          schema:
            $ref: '#/definitions/internal_images.ImagesListResponse'
        "400":
          description: ID de cabaña inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error al obtener imágenes
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar imágenes de una cabaña
      tags:
      - Imágenes
    post:
      consumes:
      - multipart/form-data
      description: Sube una imagen (JPEG, PNG o WebP, máx. 5 MB) asociada a una cabaña.
        Solo el dueño de la cabaña o un administrador.
      parameters:
      - description: ID de cabaña
        in: path
        name: cabinId
        required: true
        type: integer
      - description: Archivo de imagen
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Imagen subida exitosamente
          schema:
            $ref: '#/definitions/internal_images.CreateImageResponse'
        "400":
          description: Datos o formato inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Cabaña no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Subir imagen
      tags:
      - Imágenes
  /cabins/images/{cabinId}/principal:
    get:
      description: Devuelve la imagen más reciente de la cabaña indicada. Requiere
        token.
      parameters:
      - description: ID de cabaña
        in: path
        name: cabinId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Imagen principal
          schema:
            $ref: '#/definitions/internal_images.ImageResponse'
        "400":
          description: ID de cabaña inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: La cabaña no tiene imágenes registradas
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Imagen principal de una cabaña
      tags:
      - Imágenes
  /cabins/search:
    get:
      description: Busca cabañas combinando filtros opcionales por nombre, anfitrión,
        capacidad y precio. Requiere token.
      parameters:
      - description: Filtro por nombre
        in: query
        name: name
        type: string
      - description: Filtro por ID de anfitrión
        in: query
        name: host_id
        type: integer
      - description: Filtro por nombre de anfitrión
        in: query
        name: host_name
        type: string
      - description: Capacidad mínima
        in: query
        name: min_capacity
        type: integer
      - description: Capacidad máxima
        in: query
        name: max_capacity
        type: integer
      - description: Precio mínimo
        in: query
        name: min_price
        type: number
      - description: Precio máximo
        in: query
        name: max_price
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: Resultados de la búsqueda
          schema:
            $ref: '#/definitions/internal_cabins.CabinCardsListResponse'
        "400":
          description: Parámetros inválidos
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Buscar cabañas
      tags:
      - Cabañas
  /cabins/user/{userId}:
    get:
      description: Devuelve las cabañas cuyo anfitrión es el usuario indicado. Solo
        el propio usuario o un administrador. Requiere token.
      parameters:
      - description: ID del anfitrión
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Cabañas del usuario
          schema:
            $ref: '#/definitions/internal_cabins.CabinsListResponse'
        "400":
          description: ID de usuario inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cabañas de un usuario
      tags:
      - Cabañas
  /images/{id}:
    delete:
      description: Elimina una imagen y su archivo físico. Solo el dueño de la cabaña
        o un administrador. Requiere token.
      parameters:
      - description: ID de imagen
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Imagen eliminada exitosamente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID de imagen inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Imagen no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Eliminar imagen
      tags:
      - Imágenes
    get:
      description: Devuelve una imagen según su identificador. Requiere token.
      parameters:
      - description: ID de imagen
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Imagen
          schema:
            $ref: '#/definitions/internal_images.ImageResponse'
        "400":
          description: ID de imagen inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Imagen no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtener imagen por ID
      tags:
      - Imágenes
  /login:
    post:
      consumes:
      - application/json
      description: Autentica con correo y contraseña y devuelve un token Bearer. Endpoint
        público.
      parameters:
      - description: Credenciales de acceso
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_users.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Usuario autenticado exitosamente
          schema:
            $ref: '#/definitions/internal_users.UserLoginResponse'
        "400":
          description: Datos de entrada inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Correo o contraseña incorrectos
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión
      tags:
      - Usuarios
  /reservations:
    post:
      consumes:
      - application/json
      description: Crea una reservación. Para clientes el usuario se toma del token;
        para administradores puede indicarse. Requiere token.
      parameters:
      - description: Datos de la reservación
        in: body
        name: reservation
        required: true
        schema:
          $ref: '#/definitions/internal_reservations.ReservationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Reservación registrada exitosamente
          schema:
            $ref: '#/definitions/internal_reservations.CreateReservationResponse'
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Cabaña o usuario no existe
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflicto de fechas
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear reservación
      tags:
      - Reservaciones
  /reservations/{id}:
    put:
      consumes:
      - application/json
      description: Actualiza la cabaña y las fechas de una reservación activa. Puede
        editar quien reservó, el dueño de la cabaña o un admin. Requiere token.
      parameters:
      - description: ID de reservación
        in: path
        name: id
        required: true
        type: integer
      - description: Datos a actualizar
        in: body
        name: reservation
        required: true
        schema:
          $ref: '#/definitions/internal_reservations.UpdateReservationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reservación actualizada exitosamente
          schema:
            $ref: '#/definitions/internal_reservations.UpdateReservationResponse'
        "400":
          description: Datos inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Reservación no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflicto de fechas o reservación no editable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar reservación
      tags:
      - Reservaciones
  /reservations/{id}/cancel:
    patch:
      description: Cancela una reservación activa. Puede cancelar quien reservó, el
        dueño de la cabaña o un admin, siempre que falten al menos 3 días para el
        inicio. Requiere token.
      parameters:
      - description: ID de reservación
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reservación cancelada exitosamente
          schema:
            $ref: '#/definitions/internal_reservations.CancelReservationResponse'
        "400":
          description: ID de reservación inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Reservación no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: No cancelable o con menos de 3 días de anticipación
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancelar reservación
      tags:
      - Reservaciones
  /users:
    get:
      description: Devuelve todos los usuarios registrados. Requiere rol de administrador.
      produces:
      - application/json
      responses:
        "200":
          description: Lista de usuarios
          schema:
            items:
              $ref: '#/definitions/internal_users.User'
            type: array
        "403":
          description: Sin permisos de administrador
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error al obtener usuarios
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar usuarios
      tags:
      - Usuarios
    post:
      consumes:
      - application/json
      description: Crea una cuenta de usuario. Endpoint público, no requiere token.
      parameters:
      - description: Datos del usuario
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_users.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Usuario registrado exitosamente
          schema:
            $ref: '#/definitions/internal_users.RegisterResponse'
        "400":
          description: Datos de entrada inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: El correo o DPI ya está registrado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Registrar usuario
      tags:
      - Usuarios
  /users/{id}:
    get:
      description: Devuelve el perfil de un usuario. Solo el propio usuario o un administrador.
        Requiere token.
      parameters:
      - description: ID de usuario
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Perfil del usuario
          schema:
            $ref: '#/definitions/internal_users.User'
        "400":
          description: ID de usuario inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuario no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtener usuario por ID
      tags:
      - Usuarios
    put:
      consumes:
      - application/json
      description: Actualiza los datos de perfil. Solo el propio usuario o un administrador.
        Requiere token.
      parameters:
      - description: ID de usuario
        in: path
        name: id
        required: true
        type: integer
      - description: Datos a actualizar
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_users.UserUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: Usuario actualizado exitosamente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Datos de entrada inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Usuario no encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: El correo ya está registrado por otro usuario
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar usuario
      tags:
      - Usuarios
securityDefinitions:
  BearerAuth:
    description: 'Token JWT obtenido en el endpoint login. Enviar como: Bearer <token>'
