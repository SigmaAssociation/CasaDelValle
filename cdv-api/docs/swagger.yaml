  /payments/reservation/{reservationId}:
    get:
      description: Devuelve el historial de pagos y el desglose de total, pagado y
        saldo pendiente. Puede verlo quien reservó, el dueño de la cabaña o un admin.
        Requiere token.
      parameters:
      - description: ID de reservación
        in: path
        name: reservationId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Historial de pagos y saldo
          schema:
            $ref: '#/definitions/payments.ReservationPayments'
        "400":
          description: ID de reservación inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: No autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Reservación no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar pagos de una reservación
      tags:
      - Pagos
    post:
      consumes:
      - application/json
      description: Registra un pago simulado (tarjeta, transferencia o efectivo) sobre
        una reservación confirmada o en curso. El monto debe ser mayor que 0 y no
        puede exceder el saldo pendiente. Puede registrarlo quien reservó, el dueño
        de la cabaña o un admin. Requiere token.
      parameters:
      - description: ID de reservación
        in: path
        name: id
        required: true
        type: integer
      - description: ID de reservación
        in: path
        name: reservationId
        required: true
        type: integer
      - description: Monto y método de pago
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/payments.CreatePaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Pago registrado exitosamente
          schema:
            $ref: '#/definitions/payments.CreatePaymentResponse'
        "400":
          description: Datos inválidos, monto o método no válidos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: No autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Sin permisos
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Reservación no encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: La reservación no admite pagos o el monto excede el saldo
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Registrar pago de una reservación
      tags:
      - Pagos
