services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cdv-net

  backend-api:
    image: ghcr.io/mynordaniel/casadelvalle-backend:${BACKEND_IMAGE_TAG:-latest}
    container_name: go_api
    restart: unless-stopped
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
    volumes:
      # Imágenes subidas por los usuarios (persisten entre despliegues)
      - uploads_data:/app/uploads
    expose:
      - "8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - cdv-net

  frontend-app:
    image: ghcr.io/mynordaniel/casadelvalle-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: angular_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend-api
    networks:
      - cdv-net

volumes:
  pgdata:
  uploads_data:

networks:
  cdv-net:
    driver: bridge